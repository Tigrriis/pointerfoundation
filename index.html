<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pointer Foundation — Coming Soon</title>
  <meta name="description" content="Pointer Foundation is a not-for-profit organisation. Our website is coming soon.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #f1f5f9;
        --muted: #94a3b8;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      line-height: 1.5;
    }
    main { max-width: 36rem; }
    .mark { width: 56px; height: 56px; color: var(--accent); margin-bottom: 24px; }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    p { margin-top: 16px; color: var(--muted); font-size: 1.125rem; }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
    </svg>
    <h1>Pointer Foundation</h1>
    <p>Our website is coming soon.</p>
    <footer>&copy; <span id="year">2026</span> Pointer Foundation</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
